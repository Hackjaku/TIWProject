<div class="main-container">

  <h2 class="title">{{ data.wallet.CurrencySymbol }} Wallet History</h2>

  <div class="chart-container">
    <canvas class="chart-canvas" #balanceCanvas></canvas>
  </div>

  <hr class="divider" />

  <div class="table-container">
    <table mat-table [dataSource]="walletHistory" class="mat-elevation-z8 full-width-table">

      <ng-container matColumnDef="Date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let element">{{ element.Timestamp | date: 'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="Wallet">
        <th mat-header-cell *matHeaderCellDef>Wallet</th>
        <td mat-cell *matCellDef="let element">{{ element.WalletId }}</td>
      </ng-container>

      <ng-container matColumnDef="Amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon [ngClass]="{
            'sent-arrow': element.IsSent,
            'received-arrow': !element.IsSent
          }">
            {{ element.IsSent ? 'north_east' : 'south_west' }}
          </mat-icon>
          {{ element.Amount }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns, sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

</div>
