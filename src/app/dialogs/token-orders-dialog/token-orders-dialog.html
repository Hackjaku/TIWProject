<div class="container">

  <h2 class="title">Orders for {{ data.nft.Name }}</h2>

  <div class="loading" *ngIf="loading">
    Loading...
  </div>

  <div class="tables" *ngIf="!loading">

    <div class="sell-orders">
      <h3>Sell Orders</h3>
      <div class="table-scroll-wrapper">
        <!-- Table for Incoming Buy orders -->
        <table mat-table [dataSource]="orders.SellOrders" multiTemplateDataRows class="mat-elevation-z8">
          <!-- Position Column -->

          <ng-container matColumnDef="currency_symbol">
            <th mat-header-cell *matHeaderCellDef class="symbol-column"> Currency </th>
            <td mat-cell *matCellDef="let order" class="symbol-column"> {{ order.CurrencySymbol }} </td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef class="amount-column"> Amount </th>
            <td mat-cell *matCellDef="let order" class="amount-column"> {{ order.Amount }} </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-column"> Actions </th>
            <td mat-cell *matCellDef="let order" class="actions-column">
              <div class="action-buttons" *ngIf="isLoggedIn()">
                <!-- Accept button: only if user is NOT the NFT owner -->
                <button mat-icon-button color="primary" (click)="acceptSellOrder(order)" matTooltip="Accept"
                  *ngIf="canAcceptSellOrder(order)">
                  <mat-icon class="accept-offer">check_circle</mat-icon>
                </button>

                <!-- Cancel button: if user is NFT owner or order owner -->
                <button mat-icon-button color="primary" (click)="cancelSellOrder(order)" matTooltip="Cancel"
                  *ngIf="canCancelSellOrder(order)">
                  <mat-icon class="accept-offer">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="header"></tr>
          <tr mat-row *matRowDef="let order; columns: displayedColumns;" class="order-row"></tr>
        </table>
      </div>
    </div>

    <div class="buy-orders">
      <h3>Buy Orders</h3>
      <div class="table-scroll-wrapper">
        <table mat-table [dataSource]="orders.BuyOrders" multiTemplateDataRows class="mat-elevation-z8">

          <ng-container matColumnDef="currency_symbol">
            <th mat-header-cell *matHeaderCellDef class="symbol-column"> Currency </th>
            <td mat-cell *matCellDef="let order" class="symbol-column"> {{ order.WalletCurrencySymbol }} </td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef class="amount-column"> Amount </th>
            <td mat-cell *matCellDef="let order" class="amount-column"> {{ order.Amount }} </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-column"> Actions </th>
            <td mat-cell *matCellDef="let order" class="actions-column">
              <div class="action-buttons" *ngIf="isLoggedIn()">
                <!-- Accept button: only if user is NFT owner -->
                <button mat-icon-button color="primary" (click)="acceptBuyOrder(order)" matTooltip="Accept"
                  *ngIf="canAcceptBuyOrder()">
                  <mat-icon class="accept-offer">check_circle</mat-icon>
                </button>

                <!-- Reject button: only if user is NFT owner -->
                <button mat-icon-button color="primary" (click)="rejectBuyOrder(order)" matTooltip="Reject"
                  *ngIf="canAcceptBuyOrder()">
                  <mat-icon class="accept-offer">cancel</mat-icon>
                </button>

                <!-- Cancel button: if user placed the buy order -->
                <button mat-icon-button color="primary" (click)="cancelBuyOrder(order)" matTooltip="Cancel"
                  *ngIf="canCancelBuyOrder(order)">
                  <mat-icon class="accept-offer">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="header"></tr>
          <tr mat-row *matRowDef="let order; columns: displayedColumns;" class="order-row"></tr>
        </table>
      </div>
    </div>
  </div>

</div>
