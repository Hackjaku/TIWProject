<div class="nft-actions">
  <div class="add-button">
    <button mat-raised-button color="primary" (click)="transferNft()">
      <mat-icon>send</mat-icon>
    </button>
  </div>

  <div class="sell-button">
    <button mat-raised-button color="primary" (click)="placeSellOrder()">
      <mat-icon>sell</mat-icon>
    </button>
  </div>

  <div class="orders-button">
    <button mat-raised-button color="primary" (click)="openOrdersDialog()">
      <mat-icon>list</mat-icon>
    </button>
</div>
