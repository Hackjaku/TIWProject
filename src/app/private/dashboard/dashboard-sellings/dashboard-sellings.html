<div class="loading" *ngIf="loading">
  Loading...
</div>

<div class="table" *ngIf="!loading">

  <div class="orders-created">
    <h3>My Sell Orders</h3>
    <div class="table-scroll-wrapper">
      <table mat-table [dataSource]="sellOrders" multiTemplateDataRows class="mat-elevation-z8">
        <!-- Position Column -->
        <ng-container matColumnDef="nft_name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let order" class="name-column"> {{ order.TokenName }} </td>
        </ng-container>

        <ng-container matColumnDef="currency_symbol">
          <th mat-header-cell *matHeaderCellDef class="symbol-column"> Name </th>
          <td mat-cell *matCellDef="let order" class="symbol-column"> {{ order.CurrencySymbol }} </td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef class="amount-column"> Amount </th>
          <td mat-cell *matCellDef="let order" class="amount-column"> {{ order.Amount }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column"> Actions </th>
          <td mat-cell *matCellDef="let order" class="actions-column">
            <div class="action-buttons">
              <button mat-icon-button color="warn" (click)="deleteOrder(order)" matTooltip="Reject">
                <mat-icon class="cancel-order">cancel</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="header"></tr>
        <tr mat-row *matRowDef="let order; columns: displayedColumns;" class="order-row"></tr>
      </table>
    </div>
  </div>
</div>
